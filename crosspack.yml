# carat — build manifest for crosspack.
#
# No packages: carat is a plain console binary. The first install is a dumb
# copy, done by the Rakefile:
#
#   rake install     # crystal build + cp bin/carat ~/.carat/bin/ + PATH
#
# crosspack's part is the toolchain: `crosspack deps` installs/verifies
# crystal + git + shards on a fresh host. `crosspack install` (if ever used)
# just delegates to the same `rake install`.
#
# Afterwards carat updates itself (and every other installed shard):
#
#   carat update OrelSokolov/carat.cr
#
# The version follows shard.yml — bump both together.

name: carat
version: 0.3.0

build:
  output: builds

  # Host-axis build dependencies: what the build machine needs.
  deps:
    crystal:
      hosts:
        debian:
          verify: crystal --version
          install: curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        fedora:
          verify: crystal --version
          install: sudo dnf install -y crystal
        arch:
          verify: crystal --version
          install: sudo pacman -S --needed crystal
        darwin:
          verify: crystal --version
          install: brew install crystal
        "*":
          verify: crystal --version

    git:                      # carat clones shards with git
      hosts:
        debian:
          verify: git --version
          install: sudo apt-get install -y git
        fedora:
          verify: git --version
          install: sudo dnf install -y git
        arch:
          verify: git --version
          install: sudo pacman -S --needed git
        darwin:
          verify: git --version
          install: brew install git
        "*":
          verify: git --version

    shards:                   # no distro package — ships with Crystal
      hosts:
        "*":
          verify: shards --version

  matrix:
    - id: linux
      build: linux/amd64
      steps:
        - mkdir -p bin
        - crystal build --release --no-color src/carat.cr -o bin/carat
      artifacts:
        from: bin
        include: ["carat"]
        to: [debian-12, ubuntu-22.04, ubuntu-24.04, ubuntu-25.10, fedora-41, arch]

    - id: macos
      build: darwin/arm64
      steps:
        - mkdir -p bin
        - crystal build --release --no-color src/carat.cr -o bin/carat
      artifacts:
        from: bin
        include: ["carat"]
        to: [macos]

    - id: windows
      build: windows/amd64
      steps:
        - mkdir -p bin
        - crystal build --release --no-color src/carat.cr -o bin/carat.exe
      artifacts:
        from: bin
        include: ["*.exe"]
        to: [windows-11.0]
        mode: copy              # symlinks need dev-mode/admin on Windows

# Runtime-axis dependencies: carat runs `git clone` at runtime (it also
# invokes the crystal compiler, which has no distro package — installed via
# crystal-lang.org or brew; see build.deps above).
deps:
  version: 1
  git:
    targets:
      debian: { "*": [git] }
      ubuntu: { "*": [git] }
      fedora: { "*": [git] }
      arch: { "*": [git] }
      macos: system            # git ships with the Xcode Command Line Tools
      windows: system          # Git for Windows, installed separately

# First install = dumb copy of the already built binary (see Rakefile):
# crosspack build compiles once, crosspack install only copies it —
# no rebuild, no pack stage.
install:
  hosts:
    windows: rake install:packed COPY={{build}}/carat.exe
    "*": rake install:packed COPY={{build}}/carat
