name: carat
version: 0.10.0
authors:
  - Oleg Sokolov
description: Package manager for Crystal — RubyGems-style workflow for shard binaries
license: MIT

# BuildPool sizing: cores + MemAvailable + measured peak compiler RSS.
# >= 1.1.0: /proc TOCTOU fix — processes exiting mid-scan no longer raise
# (BuildPool samples the process tree every 250 ms while warming up).
dependencies:
  sysinfo:
    github: OrelSokolov/sysinfo.cr
    version: ">= 1.1.0"
binaries:
  - carat
